<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>query-builder demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #111827; }
        pre { background: #f3f4f6; padding: 1rem; overflow: auto; font-size: 0.8rem; }
        .themed { --qb-accent: #047857; --qb-group-bg: #ecfdf5; --qb-radius: 0; }
    </style>
    <script type="module" src="../dist/query-builder.js"></script>
</head>
<body>
<h1>&lt;query-builder&gt;</h1>
<p>Edit the rules below. The JSON underneath updates on every change, and the form submits it as the field <code>rules</code>.</p>

<form id="form">
    <query-builder id="qb" name="rules"></query-builder>
    <p><button type="submit">Submit</button> <button type="reset">Reset</button></p>
</form>

<p>Valid: <strong id="valid"></strong></p>
<pre id="output"></pre>
<p>Last submitted form data:</p>
<pre id="submitted">(nothing yet)</pre>

<h2>Themed with --qb-* properties</h2>
<query-builder class="themed" filters='[{"id":"name","label":"Name","type":"string"}]'
    rules='{"condition":"OR","rules":[{"id":"name","field":"name","type":"string","input":"text","operator":"contains","value":"son"}]}'></query-builder>

<script type="module">
    const qb = document.getElementById('qb');
    qb.filters = [
        { id: 'age', label: 'Age', type: 'integer', input: 'number' },
        { id: 'sex', label: 'Sex', type: 'integer', input: 'select', values: { 1: 'Male', 2: 'Female' } },
        { id: 'region', label: 'Region', type: 'string', input: 'select', values: [{ 1: 'North' }, { 2: 'South' }, { 3: 'East' }, { 4: 'West' }] },
        { id: 'income', label: 'Income', type: 'double' },
        { id: 'name', label: 'Name', type: 'string' },
        { id: 'interviewed', label: 'Interview date', type: 'date', operators: ['equal', 'less', 'greater', 'between', 'is_null'] },
        { id: 'consent', label: 'Consent given', type: 'boolean' },
        { id: 'channel', label: 'Channels', type: 'string', input: 'checkbox', values: { web: 'Web', phone: 'Phone', mail: 'Mail' } },
    ];
    qb.rules = {"condition": "AND", "rules": [
        {"id": "age", "field": "age", "type": "integer", "input": "number", "operator": "between", "value": [15, 74]},
        {"condition": "OR", "rules": [
            {"id": "sex", "field": "sex", "type": "integer", "input": "select", "operator": "equal", "value": 1},
            {"id": "region", "field": "region", "type": "string", "input": "select", "operator": "in", "value": ["1", "4"]}
        ]}
    ], "valid": true};

    const show = () => {
        document.getElementById('valid').textContent = String(qb.valid);
        document.getElementById('output').textContent = JSON.stringify(qb.value, null, 2);
    };
    qb.addEventListener('change', show);
    customElements.whenDefined('query-builder').then(show);
    document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('submitted').textContent = JSON.stringify(Object.fromEntries(new FormData(e.target)), null, 2);
    });
    document.getElementById('form').addEventListener('reset', () => setTimeout(show));
</script>
</body>
</html>
